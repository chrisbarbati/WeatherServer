# Import sensitive properties when present (the Pi has this file; tests do not)
spring.config.import=optional:developer.properties

# Shrink JSON responses (especially /API/weather/past) before they leave the Pi
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=1024

#JPA
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.org.springframework.scheduling=INFO
logging.level.org.hibernate=INFO

# Mail Configuration (private properties in developer.properties)
mail.host=smtp.gmail.com
mail.port=587
mail.protocol=smtp
mail.smtp.auth=true
mail.smtp.starttls.enable=true
mail.smtp.debug=true

# Scheduling intervals
scheduling.interval.cron.weather.persistence=0 */1 * * * *
scheduling.interval.cron.weather.broadcast=* * * * * *